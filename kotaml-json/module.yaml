product:
  type: kmp/lib
  platforms: [jvm, js, wasmJs, macosX64, macosArm64, iosSimulatorArm64, iosX64, linuxX64, linuxArm64, iosArm64, watchosSimulatorArm64, watchosArm32, watchosArm64, tvosSimulatorArm64, tvosX64, tvosArm64, mingwX64]

description: Convert kotaml YAML node trees to kotlinx.serialization JSON node trees

apply:
  - //library.module-template.yaml

dependencies:
  - //: exported
  - $libs.kotlinx.serialization.json: exported

plugins:
  spotless:
    formats:
      kotlin:
        licenseHeaderFile: ../license-header.txt
