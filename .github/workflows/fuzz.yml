name: Coverage-guided fuzzing

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Search time per target
        type: choice
        default: 5m
        options:
          - 30s
          - 5m
          - 10m

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [Reader, Writer]
    concurrency:
      cancel-in-progress: true
      group: fuzz-${{ github.ref }}-${{ matrix.target }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore and save discoveries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzzing/.cifuzz-corpus/com.charleskorn.kaml.fuzz.Yaml${{ matrix.target }}FuzzTest
          key: fuzz-v1-jazzer-0.30.0-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-v1-jazzer-0.30.0-${{ matrix.target }}-
      - name: Search for new failures
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_DURATION: ${{ inputs.duration || '5m' }}
        run: ./gradlew ":fuzzing:fuzz${FUZZ_TARGET}" "-PfuzzDuration=${FUZZ_DURATION}" --console=plain
      - name: Upload findings and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          include-hidden-files: true
          path: |
            fuzzing/build/fuzz
            fuzzing/build/reports/tests
            fuzzing/build/test-results
            fuzzing/src/test/resources
            fuzzing/.cifuzz-corpus
          if-no-files-found: warn
