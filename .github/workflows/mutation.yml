name: Mutation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'kotaml-json/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
      - 'scripts/mutation-test.main.kts'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: mutation-${{ github.event.pull_request.number || github.ref }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Kotlin scripting
        uses: Heapy/setup-main-kts@b0858237748f325b825e752bbac2ec2eb1fb9419 # v1.0.1
        with:
          kotlin-version: '2.4.21'
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check targeted mutations
        run: kotlinr scripts/mutation-test.main.kts
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results
          path: build/reports/mutation
          if-no-files-found: warn
