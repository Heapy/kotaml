product:
  type: kmp/lib
  platforms: [jvm, js, wasmJs, macosX64, macosArm64, iosSimulatorArm64, iosX64, linuxX64, linuxArm64, iosArm64, watchosSimulatorArm64, watchosArm32, watchosArm64, tvosSimulatorArm64, tvosX64, tvosArm64, mingwX64]

description: YAML support for kotlinx.serialization

apply:
  - //library.module-template.yaml

dependencies:
  - $libs.kotlinx.serialization.core: exported
  - $libs.snakeyaml.engine.kmp
  - $libs.okio

settings:
  kotlin:
    serialization: enabled

# Preserve the module suffix in published JVM internal/synthetic signatures.
settings@jvm:
  kotlin:
    freeCompilerArgs:
      - -module-name=io_heapy_kotaml_kotaml

# Retain the KLib identity used by existing published releases.
settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name=io.heapy.kotaml:kotaml

settings@web:
  kotlin:
    freeCompilerArgs:
      - -Xir-module-name=io.heapy.kotaml:kotaml

test-settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name=io.heapy.kotaml:kotaml-test

test-settings@web:
  kotlin:
    freeCompilerArgs:
      - -Xir-module-name=io.heapy.kotaml:kotaml-test
